<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureBite — Регистрация</title>

    <link rel="icon" href="../h-f-img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./registr.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="container nav-container">
                <div class="logo">
                    <img src="../h-f-img/favicon.ico" class="logo-img" alt="NatureBite">
                    <a href="../main/index.html" class="logo-link jost-black">NatureBite</a>
                </div>

                <ul class="nav-menu">
                    <li><a href="../delivery/delivery.html" class="nav-link jost-medium">О доставке</a></li>
                    <li><a href="../menu/menu.html" class="nav-link jost-medium">Меню на сегодня</a></li>
                    <li><a href="../calculator/calculator_ccpf.html" class="nav-link jost-medium">Расчет калорий</a></li>
                </ul>

                <div class="user-actions">
                    <a href="../like/like_recipes.html" class="user-icon">
                        <img src="../h-f-img/like.svg" alt="Избранное">
                    </a>
                    <a href="../cart/cart.html" class="user-icon">
                        <img src="../h-f-img/cart.svg" alt="Корзина">
                    </a>
                    <a href="../profile/profile.html" class="user-icon">
                        <img src="../h-f-img/profile.svg" alt="Профиль">
                    </a>
                    <div id="internal"><a href="../registration/register.html" class="jost-extrabold navbar-user">Регистрация</a></div>
                </div>
            </div>
        </nav>
    </header>


    <main>
        <div class="register-container">
            <div class="register-card">
                <form method="POST" class="register-form">

                    <h2 class="form-title jost-semibold">Регистрация</h2>
                    <div class="divider"></div>

                    <div class="imgprof"><img src="./img/profile.png" alt=""></div>
                    
                    <div class="form-group">
                        <label for="name">Имя</label>
                        <input type="text" id="name" placeholder="Введите имя" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Электронная почта</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="birthdate">Дата рождения</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>

                    <button type="submit" class="submit-btn jost-semibold">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="column">
                <div class="logo">
                    <img src="../h-f-img/logo.svg" class="logo-img" alt="NatureBite">
                    <a href="../main/index.html" class="logo-link jost-black">NatureBite</a>
                </div>
                <a class="tel_num jost-black">+7 (495) 165-44-48</a>
                <p class="work_time jost-light">Ежедневно: с 09-00 до 21-00</p>
            </div>

            <div class="column">
                <p class="social jost-bold">Мы в соцсетях:</p>
                <div class="social_media">
                    <img src="../h-f-img/telegram.svg" class="icon" alt="telegram">
                    <img src="../h-f-img/whatsapp.svg" class="icon" alt="whatsapp">
                </div>
                <p class="address jost-light">105318, Россия, г Москва, Мироновская улица, д.33с1</p>
            </div>
        </div>
    </footer>

</body>

</html>
