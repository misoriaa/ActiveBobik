<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureBite — Расчет калорий</title>

    <link rel="icon" href="../h-f-img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./calc.css">
</head>

<body>
    <script src="../JS/calc.js"></script>

    <header>
        <nav class="navbar">
            <div class="container nav-container">
                <div class="logo">
                    <img src="../h-f-img/favicon.ico" class="logo-img" alt="NatureBite">
                    <a href="../main/index.html" class="logo-link jost-black">NatureBite</a>
                </div>

                <ul class="nav-menu">
                    <li><a href="../delivery/delivery.html" class="nav-link jost-medium">О доставке</a></li>
                    <li><a href="../menu/menu.html" class="nav-link jost-medium">Меню на сегодня</a></li>
                    <li><a href="../calculator/calculator_ccpf.html" class="nav-link jost-medium active">Расчет калорий</a></li>
                </ul>

                <div class="user-actions">
                    <a href="../like/like_recipes.html" class="user-icon">
                        <img src="../h-f-img/like.svg" alt="Избранное">
                    </a>
                    <a href="../cart/cart.html" class="user-icon">
                        <img src="../h-f-img/cart.svg" alt="Корзина">
                    </a>
                    <a href="../profile/profile.html" class="user-icon">
                        <img src="../h-f-img/profile.svg" alt="Профиль">
                    </a>
                    <div id="internal"><a href="../registration/register.html" class="jost-extrabold navbar-user">Регистрация</a></div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="calculator-container">
            <div class="calculator-card">
                <div class="calculator-header">
                    <h1 class="calculator-title jost-bold">Калькулятор калорий</h1>
                </div>

                <div class="calculator-body">
                    <div class="input-row">
                        <div class="input-group">
                            <label class="input-label jost-semibold">Пол</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="gender" value="male" class="radio-input">
                                    <span class="radio-custom"></span>
                                    Мужской
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="gender" value="female" class="radio-input" checked>
                                    <span class="radio-custom"></span>
                                    Женский
                                </label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="weight" class="input-label jost-semibold">Вес (кг)</label>
                            <input type="number" id="weight" class="text-input" value="70">
                        </div>

                        <div class="input-group">
                            <label for="height" class="input-label jost-semibold">Рост (см)</label>
                            <input type="number" id="height" class="text-input" value="170" min="50" max="250">
                        </div>

                        <div class="input-group">
                            <label for="age" class="input-label jost-semibold">Возраст</label>
                            <input type="number" id="age" class="text-input" value="25" min="1" max="120">
                        </div>
                    </div>

                    <div class="result-section">
                        <div class="result-block">
                            <span class="result-label jost-medium">Ваша норма:</span>
                            <span id="result" class="result-value jost-black">0</span>
                            <span class="result-unit">ккал/день</span>
                        </div>
                        <button class="calculate-btn jost-bold" onclick="calculate()">Рассчитать</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="column">
                <div class="logo">
                    <img src="../h-f-img/logo.svg" class="logo-img" alt="NatureBite">
                    <a href="../main/index.html" class="logo-link jost-black">NatureBite</a>
                </div>
                <a class="tel_num jost-black">+7 (495) 165-44-48</a>
                <p class="work_time jost-light">Ежедневно: с 09-00 до 21-00</p>
            </div>

            <div class="column">
                <p class="social jost-bold">Мы в соцсетях:</p>
                <div class="social_media">
                    <img src="../h-f-img/telegram.svg" class="icon" alt="telegram">
                    <img src="../h-f-img/whatsapp.svg" class="icon" alt="whatsapp">
                </div>
                <p class="address jost-light">105318, Россия, г Москва, Мироновская улица, д.33с1</p>
            </div>
        </div>
    </footer>
</body>

</html>
